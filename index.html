<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMD Learner</title>
  <meta name="description" content="CMD Learner - تعلم أوامر CMD و أمان النظام مع Yassen Islam">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CMD Learner</h1>
  <input type="text" id="search" placeholder="ابحث عن امر...">
  <div id="commands">
    <!-- Disk Management -->
    <h2>Disk Management</h2>
    <p><code>diskpart</code> - تقسيم الهارد <button onclick="copy('diskpart')">نسخ</button></p>
    <p><code>chkdsk</code> - فحص الهارد <button onclick="copy('chkdsk')">نسخ</button></p>
    
    <!-- Boot & Recovery -->
    <h2>Boot & Recovery</h2>
    <p><code>bcdedit</code> - تعديل ال Boot <button onclick="copy('bcdedit')">نسخ</button></p>
    
    <!-- System Repair -->
    <h2>System Repair</h2>
    <p><code>sfc /scannow</code> - اصلاح النظام <button onclick="copy('sfc /scannow')">نسخ</button></p>
  </div>
  <button onclick="downloadPDF()">حمل ك PDF</button>
  <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})">رجوع لأعلى</button>

  <div id="comments">
    <!-- Disqus هنا -->
    <div id="disqus_thread"></div>
    <script>
      (function() {
        var d = document, s = d.createElement('script');
        s.src = 'https://cmd-learner.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
      })();
    </script>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.min.js"></script>
  <script>
    function copy(text) {
      navigator.clipboard.writeText(text);
      alert('تم النسخ: ' + text);
    }
    function downloadPDF() {
      const element = document.getElementById('commands');
      html2pdf().from(element).save('CMD-Learner.pdf');
    }
    document.getElementById('search').addEventListener('input', function(e) {
      const search = e.target.value.toLowerCase();
      document.querySelectorAll('#commands p').forEach(p => {
        const text = p.textContent.toLowerCase();
        p.style.display = text.includes(search) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
